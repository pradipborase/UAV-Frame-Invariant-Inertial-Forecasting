      - {config_id: TR06, d_model: 32, n_heads: 2, n_layers: 2, ff_multiplier: 2, dropout: 0.1, pooling: mean, lr: 3.0e-4, weight_decay: 0.0}
      - {config_id: TR07, d_model: 16, n_heads: 4, n_layers: 1, ff_multiplier: 4, dropout: 0.0, pooling: last, lr: 3.0e-4, weight_decay: 1.0e-4}
      - {config_id: TR08, d_model: 32, n_heads: 4, n_layers: 2, ff_multiplier: 2, dropout: 0.1, pooling: last, lr: 3.0e-4, weight_decay: 1.0e-4}
      - {config_id: TR09, d_model: 16, n_heads: 2, n_layers: 1, ff_multiplier: 2, dropout: 0.1, pooling: mean, lr: 1.0e-3, weight_decay: 0.0}
